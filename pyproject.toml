[project]
name = "ai-scientist"
version = "0.1.0"
description = "A reproducible AI system for iterative scientific experimentation"
readme = "README.md"
authors = [
    { name = "dps0809", email = "divyaprakash.hp1973@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "rich>=13.9",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "requests>=2.32",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
ai-scientist = "ai_scientist.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
